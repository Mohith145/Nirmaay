[project]
name = "nirmaay-backend"
version = "0.1.0"
description = "Nirmaay oral cancer screening API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "firebase-admin>=6.5,<8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends() in function defaults is intentional (standard pattern).
# E501: Long lines acceptable in test assertions and long string literals.
# PLC0415: Lazy imports inside functions are intentional (circular-import avoidance, optional modules).
ignore = ["B008", "E501", "PLC0415"]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF", "PLC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
